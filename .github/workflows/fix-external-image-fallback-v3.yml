name: Fix external image fallback v3

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-external-image-fallback-v3'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Patch external product image fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/DataActions.gs')
          s=p.read_text(encoding='utf-8')
          old="  if(!m) return '';\n  try{\n    const file=DriveApp.getFileById(m[1]);\n"
          new="  if(!m){\n    if(!/^https?:\\/\\//i.test(raw)) return '';\n    try{\n      const response=UrlFetchApp.fetch(raw,{method:'get',muteHttpExceptions:true,followRedirects:true,headers:{'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'}});\n      const code=response.getResponseCode();\n      if(code<200||code>=300) return '';\n      const blob=response.getBlob();\n      const mime=String(blob.getContentType()||'').toLowerCase();\n      if(!/^image\\//.test(mime)) return '';\n      const bytes=blob.getBytes();\n      if(bytes.length>5*1024*1024) return '';\n      return 'data:'+mime+';base64,'+Utilities.base64Encode(bytes);\n    }catch(_){ return ''; }\n  }\n  try{\n    const file=DriveApp.getFileById(m[1]);\n"
          if old not in s:
              raise SystemExit('Target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate Apps Script syntax
        run: |
          cp src/DataActions.gs /tmp/DataActions.js
          node --check /tmp/DataActions.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DataActions.gs
          git commit -m "Proxy external product images in return details"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
