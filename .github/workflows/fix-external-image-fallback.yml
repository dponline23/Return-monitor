name: Fix external image fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-external-image-fallback.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extend product image proxy to external URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/DataActions.gs')
          s=p.read_text(encoding='utf-8')
          old="""  if(!m) return '';
  try{
    const file=DriveApp.getFileById(m[1]);
"""
          new="""  if(!m){
    if(!/^https?:\\/\\//i.test(raw)) return '';
    try{
      const response=UrlFetchApp.fetch(raw,{
        method:'get',
        muteHttpExceptions:true,
        followRedirects:true,
        headers:{
          'User-Agent':'Mozilla/5.0',
          'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'
        }
      });
      const code=response.getResponseCode();
      if(code<200||code>=300) return '';
      const blob=response.getBlob();
      const mime=String(blob.getContentType()||'').toLowerCase();
      if(!/^image\\//.test(mime)) return '';
      const bytes=blob.getBytes();
      if(bytes.length>5*1024*1024) return '';
      return 'data:'+mime+';base64,'+Utilities.base64Encode(bytes);
    }catch(_){ return ''; }
  }
  try{
    const file=DriveApp.getFileById(m[1]);
"""
          if old not in s:
              raise SystemExit('Target apiGetProductImageData block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate Apps Script syntax
        run: |
          node --check src/DataActions.gs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DataActions.gs
          git commit -m "Proxy external product images in return details"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
