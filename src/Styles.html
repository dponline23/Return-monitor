<script>
window.addEventListener('load',()=>{
  const i=(name)=>{const common='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';const p={back:'<path d="m15 18-6-6 6-6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',box:'<path d="m21 8-9 5-9-5"/><path d="M3 8l9-5 9 5v8l-9 5-9-5Z"/><path d="M12 13v8"/>',user:'<circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',link:'<path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/>',truck:'<path d="M10 17h4V5H2v12h3"/><path d="M14 8h4l4 4v5h-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/>',file:'<path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><rect x="4" y="4" width="11" height="11" rx="2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>',tag:'<path d="M20 13 13 20 4 11V4h7Z"/><circle cx="8.5" cy="8.5" r="1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',refresh:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M9 10h6M9 14h6"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',hand:'<path d="M7 11V6a2 2 0 0 1 4 0v4"/><path d="M11 10V5a2 2 0 0 1 4 0v5"/><path d="M15 10V7a2 2 0 0 1 4 0v6c0 5-3 8-7 8h-1c-3 0-5-2-6-4l-2-4a2 2 0 0 1 3-2l2 2"/>',order:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>'};return `<svg ${common}>${p[name]||p.box}</svg>`;};
  const rowHtml=(icon,label,value,action='')=>`<div class="refRow"><span class="refRowIcon">${i(icon)}</span><span class="refRowLabel">${esc(label)}</span><div class="refRowValue">${value||'<span class="muted">—</span>'}</div>${action?`<div class="refRowAction">${action}</div>`:''}</div>`;
  const orderValue=(row)=>{const n=row.supplierOrderNumber||'';if(!n)return '<span class="muted">—</span>';return row.supplierOrderUrl?`<a class="orderLink" href="${attr(row.supplierOrderUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">#${esc(n)} ↗</a>`:`<strong>#${esc(n)}</strong>`;};
  const copyBtn=(value,label)=>value?`<button class="refIconBtn" type="button" onclick="event.stopPropagation();refCopy('${jsq(value)}','${jsq(label)}')">${i('copy')}</button>`:'';
  window.refCopy=(value,label)=>{if(!value)return;const done=()=>toast((label||'Значення')+' скопійовано');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(done).catch(()=>{const a=document.createElement('textarea');a.value=value;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done();});}else{const a=document.createElement('textarea');a.value=value;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done();}};
  window.renderDetails=()=>{
    const row=(model.rows||[]).find(item=>item.id===selectedId);if(!row){closeDetails();return;}
    const drawer=document.getElementById('detailsDrawer');drawer.classList.add('refDetails');
    drawer.querySelector('.drawerHead').innerHTML=`<button class="refBack" type="button" onclick="closeDetails()">${i('back')}</button><div class="refHeadTitle"><strong>Повернення</strong><span>Деталі повернення</span></div><button class="refMore" type="button" aria-label="Більше дій">${i('more')}</button>`;
    const originalTtn=row.originalTtn||row.ttn||'';
    const returnTtn=row.returnTtn||'';
    const product=(row.productName||row.productImage)?`<section class="refCard"><div class="refCardHead"><div class="refCardTitle"><span class="refSectionIcon">${i('box')}</span><strong>Товар</strong></div></div><div class="refProductInner">${row.productImage?`<img src="${attr(row.productImage)}" alt="">`:'<div class="refProductPlaceholder">▧</div>'}<div><strong>${esc(row.productName||'Товар')}</strong></div></div></section>`:'';
    const notifyBlock=row.supplierNotified?`<div class="refNotifyState">${i('bell')}<div><strong>Постачальника сповіщено</strong><span>${fmtDateTime(row.supplierNotifiedAt)}</span></div></div>`:`<button class="btn secondary refNotifyBtn" type="button" onclick="setSupplierNotified('${jsq(row.id)}',true)">${i('bell')} Позначити сповіщення</button>`;
    const cancelNotify=row.supplierNotified?`<button class="refCancel" type="button" onclick="setSupplierNotified('${jsq(row.id)}',false)">${i('ban')} Скасувати відмітку</button>`:'';
    let pickup='';
    if(row.supplierPickedUp){pickup=`<div class="refPickupBox" style="background:#eefaf2;border-color:#d5ecdc;color:#257449"><span class="refPickupIcon" style="background:#ddf3e5">${i('hand')}</span><div><strong>Забрано постачальником</strong><span>${fmtDateTime(row.supplierPickedUpAt)}</span></div><button class="refCancel" style="grid-column:1/-1" type="button" onclick="setPickedUp('${jsq(row.id)}',false)">Скасувати відмітку</button></div>`;}else if(row.supplierPickupStatus==='waiting_pickup'){pickup=`<div class="refPickupBox"><span class="refPickupIcon">${i('clock')}</span><div><strong>Очікує забору</strong><span>Повернення вже прибуло та очікує отримання постачальником.</span></div><button class="btn primary pickupAction" type="button" onclick="setPickedUp('${jsq(row.id)}',true)">✓ Позначити як забране постачальником</button></div>`;}else{pickup=`<div class="refPickupBox"><span class="refPickupIcon">${i('clock')}</span><div><strong>Ще в дорозі / не передано</strong><span>«Прибуло» встановлюється лише після підтвердження логістики, що повернення фактично прибуло.</span></div></div>`;}
    document.getElementById('drawerBody').innerHTML=`
      <section class="refCard refSummary"><div class="refSummaryLeft"><span class="refSummaryIcon">${i('box')}</span><div class="refStatusWrap">${statusBadge(row.returnStatus)}<div class="refCaption">Статус повернення</div></div></div><div class="refSummaryDivider"></div><div class="refSummaryRight"><strong>${row.orderNumber?('#'+esc(row.orderNumber)):'—'}</strong><div class="refCaption">Замовлення джерела</div></div></section>
      <section class="refCard"><div class="refCardHead"><div class="refCardTitle"><span class="refSectionIcon">${i('user')}</span><strong>Основна інформація</strong></div><button class="refEditBtn" type="button" onclick="openReturnForm('${jsq(row.id)}')">${i('edit')} Редагувати</button></div><div class="refRows">${rowHtml('box','Постачальник',`<strong>${esc(row.supplierName||'—')}</strong>`)}${rowHtml('order','Замовлення',orderValue(row))}${rowHtml('link','Замовлення джерела',row.orderNumber?`<strong>#${esc(row.orderNumber)}</strong>`:'<span class="muted">—</span>')}</div></section>
      ${product}
      <section class="refCard"><div class="refCardHead"><div class="refCardTitle"><span class="refSectionIcon">${i('truck')}</span><strong>Дані для постачальника</strong></div></div><div class="refRows">${rowHtml('truck','Першочергова ТТН',`<strong>${esc(originalTtn||'—')}</strong>`,copyBtn(originalTtn,'ТТН'))}${rowHtml('refresh','ТТН повернення',`<strong>${esc(returnTtn||'—')}</strong>`)}${rowHtml('link','Замовлення на сайті',orderValue(row))}${rowHtml('file','Назва товару',`<strong>${esc(row.productName||'—')}</strong>`)}</div><div class="refSupplierActions"><button class="btn primary refCopyAll" type="button" onclick="copySupplierData('${jsq(row.id)}')">${i('copy')} Скопіювати все</button>${notifyBlock}</div>${cancelNotify}</section>
      <section class="refCard"><div class="refCardHead"><div class="refCardTitle"><span class="refSectionIcon">${i('refresh')}</span><strong>Повернення</strong></div><button class="refIconBtn" type="button" onclick="openReturnForm('${jsq(row.id)}')">${i('edit')}</button></div><div class="refRows">${rowHtml('alert','Причина',`<strong>${esc(reasonLabel(row.returnReason,row.returnReasonComment)||'—')}</strong>`)}${rowHtml('tag','Статус',statusBadge(row.returnStatus))}${rowHtml('coin','Сума',`<strong>${money(row.amount)}</strong>`)}${rowHtml('calendar','Дата повернення',`<strong>${row.returnDate?fmtDateTime(row.returnDate):'—'}</strong>`)}${rowHtml('truck','Логістика',row.deliveryStatus?`<div><strong>${esc(row.deliveryStatus)}</strong>${row.returnTtn||row.ttn?`<div class="detailMuted">${esc(row.returnTtn||row.ttn)}</div>`:''}</div>`:'<span class="muted">—</span>')}</div></section>
      <section class="refCard"><div class="refCardHead"><div class="refCardTitle"><span class="refSectionIcon">${i('hand')}</span><strong>Забір постачальником</strong></div></div>${pickup}</section>
      <button class="refBackList" type="button" onclick="closeDetails()">${i('back')} Повернутися до списку</button>`;
  };
});
</script>
