name: Fix mobile title compact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-title-compact.yml'

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply compact mobile title patch
        run: python .github/fix_mobile_title_compact.py

      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/Styles.html
          if ! git diff --cached --quiet; then
            git commit -m "Compact mobile title and spacing"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub Actions secret CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Remove temporary authorization
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.json
