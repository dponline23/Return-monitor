name: Fix mobile top once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-top-once.yml'

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Repair mobile dashboard markup and CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          styles = Path('src/Styles.html')
          css = styles.read_text(encoding='utf-8')

          # Previous generated patch accidentally wrote literal "\\n" strings.
          # Convert only that appended mobile block back to real line breaks.
          literal_marker = r'\n<style>\n/* MOBILE_TOP_V2 */'
          pos = css.find(literal_marker)
          if pos >= 0:
              css = css[:pos] + css[pos:].replace(r'\n', '\n')

          # Final overrides: exact mobile composition from the approved reference.
          if '/* MOBILE_TOP_V3 */' not in css:
              css += '''
<style>
/* MOBILE_TOP_V3 */
@media(max-width:760px){
  .app{padding:18px 16px 12px!important}
  .dashboardHero{display:block!important;position:relative!important;margin:0 0 14px!important;padding:8px 2px 0!important}
  .heroBrand{display:grid!important;grid-template-columns:66px minmax(0,1fr)!important;gap:16px!important;align-items:start!important;width:100%!important}
  .heroBrandIcon{width:66px!important;height:66px!important;border-radius:20px!important;background:linear-gradient(145deg,#e8fff0,#d9f8e5)!important;margin-top:3px!important}
  .heroBrandIcon svg{width:40px!important;height:40px!important}
  .heroCopy{min-width:0}
  .heroCopy h1{font-size:35px!important;line-height:.98!important;margin:0 0 13px!important;font-weight:850!important;letter-spacing:-.045em!important}
  .heroCopy h1 span{display:block!important}
  .heroCopy p{font-size:18px!important;line-height:1.16!important;color:#697386!important;margin:0!important;max-width:310px!important}
  .heroSetup{grid-column:1/-1!important;margin:17px 0 0!important;display:flex!important;align-items:center!important;gap:10px!important;font-size:14px!important;color:#6e788a!important;white-space:nowrap!important;overflow:hidden!important}
  .heroSetup strong{color:#0b9c50!important;font-weight:750!important}
  .setupLinkIcon{width:32px!important;height:32px!important;border-radius:50%!important;background:#e4faeb!important;color:#07994b!important;display:grid!important;place-items:center!important;flex:0 0 32px!important}

  .heroActions{margin-top:16px!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;width:100%!important}
  .periodSyncCard{grid-column:1/-1!important;display:grid!important;grid-template-columns:minmax(0,1.55fr) 1px minmax(112px,.85fr)!important;align-items:stretch!important;background:#fff!important;border:1px solid #edf0f3!important;border-radius:18px!important;box-shadow:0 8px 24px rgba(16,24,40,.055)!important;min-height:92px!important;overflow:visible!important}
  .periodSyncCard::before{content:''!important;grid-column:2!important;grid-row:1!important;background:#e8ebef!important;width:1px!important;margin:18px 0!important}
  .heroPeriod{grid-column:1!important;grid-row:1!important;position:relative!important;width:auto!important;height:auto!important;min-width:0!important;border:0!important;box-shadow:none!important;background:transparent!important;border-radius:18px 0 0 18px!important;display:grid!important;grid-template-columns:50px minmax(0,1fr)!important;gap:12px!important;align-items:center!important;padding:16px 18px!important;overflow:visible!important}
  .heroActionIcon{display:grid!important;width:48px!important;height:48px!important;place-items:center!important;color:#64708a!important}
  .heroActionIcon svg{width:42px!important;height:42px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.7!important}
  .heroPeriodText{display:grid!important;min-width:0!important}
  .heroPeriodText small{font-size:14px!important;color:#7d8798!important;line-height:1.05!important}
  .heroPeriodText strong{font-size:27px!important;line-height:1.05!important;margin-top:4px!important;font-weight:750!important;color:#101828!important}
  .periodChevron{font-size:23px!important;margin-left:5px!important}
  .periodInputs{display:none!important;position:absolute!important;left:12px!important;right:12px!important;top:86px!important;z-index:30!important;background:#fff!important;border:1px solid #e3e7eb!important;border-radius:13px!important;box-shadow:0 14px 35px rgba(16,24,40,.16)!important;padding:10px!important;grid-template-columns:1fr auto 1fr!important;gap:6px!important;align-items:center!important}
  .heroPeriod.periodOpen .periodInputs{display:grid!important}
  .periodInputs input{width:100%!important;min-width:0!important;height:38px!important;border:1px solid #e3e7eb!important;border-radius:9px!important;padding:0 7px!important;font-size:12px!important;background:#fff!important}
  .periodInputs .periodDash{display:block!important;text-align:center!important}
  .heroSync{grid-column:3!important;grid-row:1!important;border:0!important;background:#fff!important;border-radius:0 18px 18px 0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:5px!important;color:#667085!important;font-size:13px!important;cursor:pointer!important;padding:12px 8px!important}
  .heroSyncIcon{display:block!important;color:#07994b!important;font-size:43px!important;line-height:.82!important;font-weight:500!important}
  .heroSettings,.heroAdd{grid-column:auto!important;width:100%!important;min-height:62px!important;border-radius:16px!important;font-size:18px!important;gap:10px!important;padding:10px 14px!important}
  .heroSettings{background:#fff!important;border:1px solid #edf0f3!important;color:#101828!important}
  .heroAdd{background:linear-gradient(135deg,#06954a,#087a3d)!important;border-color:#087a3d!important;color:#fff!important}
  .heroBtnIcon,.heroPlus{display:inline-grid!important;place-items:center!important;font-size:27px!important;line-height:1!important}
  .heroPlus{font-size:37px!important;font-weight:300!important}

  .heroStats{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;margin:0 0 14px!important}
  .heroStats .statCard{display:block!important;position:relative!important;min-height:122px!important;padding:15px!important;border-radius:18px!important;border:1px solid #edf0f3!important;background:#fff!important;box-shadow:0 8px 24px rgba(16,24,40,.045)!important;overflow:hidden!important}
  .heroStats .statIcon{width:39px!important;height:39px!important;border-radius:12px!important;margin:0 0 12px!important;font-size:18px!important}
  .heroStats .statValue{font-size:30px!important;line-height:1!important;margin:0 0 5px!important;font-weight:820!important;letter-spacing:-.035em!important;white-space:nowrap!important}
  .heroStats .statLabel{font-size:14px!important;line-height:1.14!important;font-weight:500!important;color:#465166!important}
  .heroStats .statHint{display:none!important}
  .statChevron{display:block!important;position:absolute!important;right:14px!important;top:13px!important;color:#596579!important;font-size:27px!important;line-height:1!important}
  .heroStats .statCard::after{content:''!important;position:absolute!important;right:-36px!important;bottom:-46px!important;width:110px!important;height:92px!important;border-radius:50%!important;background:#eafbf0!important;opacity:.92!important;pointer-events:none!important}
  .heroStats .statWaitingCard::after{background:#fff5dc!important}
  .heroStats .statAmountCard::after{background:#f1f4f7!important}
}
@media(max-width:390px){
  .app{padding:15px 13px 10px!important}
  .heroBrand{grid-template-columns:58px minmax(0,1fr)!important;gap:13px!important}
  .heroBrandIcon{width:58px!important;height:58px!important;border-radius:18px!important}
  .heroBrandIcon svg{width:34px!important;height:34px!important}
  .heroCopy h1{font-size:31px!important}
  .heroCopy p{font-size:16px!important}
  .heroSetup{font-size:12.5px!important;margin-top:14px!important;gap:8px!important}
  .setupLinkIcon{width:29px!important;height:29px!important;flex-basis:29px!important}
  .periodSyncCard{min-height:84px!important;grid-template-columns:minmax(0,1.52fr) 1px minmax(104px,.82fr)!important}
  .heroPeriod{grid-template-columns:43px minmax(0,1fr)!important;gap:9px!important;padding:13px 14px!important}
  .heroActionIcon{width:43px!important;height:43px!important}.heroActionIcon svg{width:36px!important;height:36px!important}
  .heroPeriodText strong{font-size:24px!important}.heroPeriodText small{font-size:12px!important}
  .heroSync{font-size:12px!important}.heroSyncIcon{font-size:38px!important}
  .heroSettings,.heroAdd{min-height:56px!important;font-size:16px!important;border-radius:15px!important}
  .heroStats .statCard{min-height:112px!important;padding:13px!important}
  .heroStats .statIcon{width:36px!important;height:36px!important;margin-bottom:10px!important}
  .heroStats .statValue{font-size:27px!important}.heroStats .statLabel{font-size:12.5px!important}
}
</style>
'''

          styles.write_text(css, encoding='utf-8')

          index = Path('src/Index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('<h1><span>Відстеження</span><span>повернень</span></h1>', '<h1><span>Відстеження</span> <span>повернень</span></h1>')
          old = '''        <p>Контроль повернень та отримання їх постачальниками</p>\n        <div class="setupLine heroSetup" id="setupLine">Завантаження…</div>\n      </div>\n    </div>'''
          new = '''        <p>Контроль повернень та отримання їх постачальниками</p>\n      </div>\n      <div class="setupLine heroSetup" id="setupLine">Завантаження…</div>\n    </div>'''
          if old in text:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/Styles.html
          git commit -m "Repair mobile dashboard and match approved top" || true
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub Actions secret CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Remove temporary authorization
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
