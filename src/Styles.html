<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#1677ff;--ok:#14804a;--warn:#a15c00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Arial,sans-serif}.app{max-width:1180px;margin:0 auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.title{font-size:22px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;cursor:pointer}.tab.active{background:#172033;color:#fff;border-color:#172033}.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.table{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:110px minmax(220px,1.7fr) 140px 150px 170px 190px;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}.row.head{border-top:0;background:#fafafa;color:var(--muted);font-size:12px;font-weight:700}.main b{display:block}.meta{font-size:12px;color:var(--muted);margin-top:2px}.status{font-size:12px;font-weight:700}.status.warn{color:var(--warn)}.status.ok{color:var(--ok)}.edit{display:flex;gap:6px}.edit input{min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px}.empty{padding:28px;text-align:center;color:var(--muted)}.error{background:#fff2f2;border:1px solid #ffd2d2;color:#8b1e1e;padding:10px;border-radius:10px;margin-bottom:10px;display:none}.loader{opacity:.55;pointer-events:none}
.dialog{width:min(520px,calc(100vw - 24px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px rgba(15,23,42,.22)}.dialog::backdrop{background:rgba(15,23,42,.42)}.dialog form{padding:20px}.dialogHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.dialogHead h2{font-size:20px;margin:3px 0 0}.dialogEyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.iconBtn{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}.dialogText{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin-top:12px}.field span{font-size:12px;font-weight:700}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit}.dialogStatus{margin-top:14px;padding:10px 11px;border-radius:10px;background:#f5f7fa;color:var(--muted);font-size:12px}.dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:800px){.app{padding:12px}.top{align-items:flex-start}.kpis{grid-template-columns:repeat(2,1fr)}.row.head{display:none}.row{grid-template-columns:1fr;gap:7px;padding:12px}.table{background:transparent;border:0;display:grid;gap:10px}.row:not(.head){background:#fff;border:1px solid var(--line);border-radius:12px}.edit{display:grid;grid-template-columns:1fr 1fr}.actions{flex-direction:column}.title{font-size:19px}.dialog form{padding:16px}}
</style>
