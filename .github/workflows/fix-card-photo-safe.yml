name: Safe compact card and photo fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-card-photo-safe.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Patch only card UI and image rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/Index.html')
          s = index.read_text(encoding='utf-8')

          helpers = r'''function compactReturnNumber(value){
            const raw=String(value||'').trim();
            const m=raw.match(/^RTN-\d{4}-(\d+)$/i);
            return m?('RTN-'+String(Number(m[1]))):(raw||'—');
          }
          function driveImageId(value){
            const raw=String(value||'').trim();
            if(!raw)return '';
            let m=raw.match(/[?&]id=([A-Za-z0-9_-]{10,})/i);
            if(!m)m=raw.match(/\/d\/([A-Za-z0-9_-]{10,})/i);
            return m?m[1]:'';
          }
          function directProductImageUrl(value){
            const raw=String(value||'').trim();
            if(!raw||/^data:image\//i.test(raw))return raw;
            const id=driveImageId(raw);
            return id?('https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w480'):raw;
          }
          function productImageTag(value,className){
            const raw=String(value||'').trim();
            if(!raw)return '';
            const src=directProductImageUrl(raw);
            const cls=className?' class="'+attr(className)+'"':'';
            return '<img'+cls+' src="'+attr(src)+'" data-original="'+attr(raw)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="retryProductImage(this)">';
          }
          function retryProductImage(img){
            if(!img||img.dataset.proxyAttempted==='1')return;
            img.dataset.proxyAttempted='1';
            const original=img.dataset.original||'';
            if(!original){img.style.display='none';return;}
            google.script.run
              .withSuccessHandler(function(dataUrl){
                if(dataUrl){img.onerror=null;img.src=dataUrl;}
                else{img.style.display='none';}
              })
              .withFailureHandler(function(){img.style.display='none';})
              .apiGetProductImageData(original);
          }
          function mobileCardHtml(row){
            const image=row.productImage?productImageTag(row.productImage,'compactCardPhoto'):'<span class="compactCardPhoto compactCardPlaceholder">▧</span>';
            const supplier=esc(row.supplierName||'Постачальник не вказаний');
            const notified=row.supplierNotified?'<span class="compactNotified" title="Постачальника сповіщено">✓</span>':'';
            return `<article class="returnCard compactCardV2" onclick="openDetails('${jsq(row.id)}')">
              <div class="compactCardHead">
                <div class="compactCardIdentity"><strong class="compactCardRtn">${esc(compactReturnNumber(row.returnNumber))}</strong><span class="compactCardSupplier">${supplier}</span>${notified}</div>
                <strong class="compactCardAmount">${money(row.amount)}</strong>
              </div>
              ${(row.productName||row.productImage)?`<div class="compactCardProduct">${image}<div class="compactCardProductName">${esc(row.productName||'Товар')}</div></div>`:''}
              <div class="compactCardBadges"><span class="reasonPill">${esc(reasonLabel(row.returnReason,row.returnReasonComment)||'Причина не вказана')}</span>${statusBadge(row.returnStatus)}${pickupBadge(row.supplierPickupStatus)}</div>
              <div class="compactCardDate"><span>◷</span><span>${fmtDateTimeShort(row.returnDate||row.arrivedAt||row.returnStartedAt)}</span></div>
            </article>`;
          }
          '''

          a=s.index('function mobileCardHtml(row){')
          b=s.index('function emptyStateHtml',a)
          s=s[:a]+helpers+s[b:]

          old_product="function productMini(row){if(!row.productName&&!row.productImage)return '<span class=\"muted\">—</span>';const image=row.productImage?`<img src=\"${attr(row.productImage)}\" alt=\"\" onerror=\"this.closest('.productMini').classList.add('imageError');this.remove()\">`:'<span class=\"imagePlaceholder\">▧</span>';return `<div class=\"productMini\">${image}<div><strong>${esc(row.productName||'Товар')}</strong></div></div>`;}"
          new_product="function productMini(row){if(!row.productName&&!row.productImage)return '<span class=\"muted\">—</span>';const image=row.productImage?productImageTag(row.productImage,'productMiniPhoto'):'<span class=\"imagePlaceholder\">▧</span>';return `<div class=\"productMini\">${image}<div><strong>${esc(row.productName||'Товар')}</strong></div></div>`;}"
          if old_product not in s:
            raise SystemExit('productMini source pattern not found')
          s=s.replace(old_product,new_product,1)

          old_detail="${row.productImage?`<img src=\"${attr(row.productImage)}\" alt=\"\">`:'<div class=\"detailImagePlaceholder\">▧</div>'}"
          new_detail="${row.productImage?productImageTag(row.productImage,'detailProductImage'):'<div class=\"detailImagePlaceholder\">▧</div>'}"
          if old_detail not in s:
            raise SystemExit('detail image source pattern not found')
          s=s.replace(old_detail,new_detail,1)

          old_preview="function renderImagePreview(src){const el=document.getElementById('imagePreview');el.innerHTML=src?`<img src=\"${attr(src)}\" alt=\"Попередній перегляд\">`:'<span>Фото</span>'; }"
          if old_preview not in s:
            old_preview="function renderImagePreview(src){const el=document.getElementById('imagePreview');el.innerHTML=src?`<img src=\"${attr(src)}\" alt=\"Попередній перегляд\">`:'<span>Фото</span>';}"
          new_preview="function renderImagePreview(src){const el=document.getElementById('imagePreview');el.innerHTML=src?productImageTag(src,'previewProductImage'):'<span>Фото</span>'; }"
          if old_preview not in s:
            raise SystemExit('renderImagePreview source pattern not found')
          s=s.replace(old_preview,new_preview,1)

          index.write_text(s,encoding='utf-8')

          actions=Path('src/DataActions.gs')
          ds=actions.read_text(encoding='utf-8')
          marker='// PRODUCT_IMAGE_FALLBACK_V1'
          if marker not in ds:
            ds += r'''

          // PRODUCT_IMAGE_FALLBACK_V1
          function apiGetProductImageData(imageUrl){
            const raw=String(imageUrl||'').trim();
            if(!raw) return '';
            let m=raw.match(/[?&]id=([A-Za-z0-9_-]{10,})/i);
            if(!m) m=raw.match(/\/d\/([A-Za-z0-9_-]{10,})/i);
            if(!m) return '';
            try{
              const file=DriveApp.getFileById(m[1]);
              let blob=null;
              try{ blob=file.getThumbnail(); }catch(_){ }
              if(!blob) blob=file.getBlob();
              const bytes=blob.getBytes();
              if(bytes.length>4*1024*1024) return '';
              return 'data:'+String(blob.getContentType()||'image/jpeg')+';base64,'+Utilities.base64Encode(bytes);
            }catch(_){
              return '';
            }
          }
          '''
          actions.write_text(ds,encoding='utf-8')

          styles=Path('src/Styles.html')
          css=styles.read_text(encoding='utf-8')
          marker='/* COMPACT_CARD_V2_SAFE */'
          if marker not in css:
            css += r'''

          <style>
          /* COMPACT_CARD_V2_SAFE */
          @media(max-width:760px){
            .mobileCards{gap:9px!important}
            .returnCard.compactCardV2{padding:12px!important;border-radius:18px!important;background:#fff!important;border:1px solid var(--line-soft)!important;box-shadow:0 4px 14px rgba(16,24,40,.04)!important}
            .compactCardHead{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;min-width:0!important}
            .compactCardIdentity{display:flex!important;align-items:center!important;gap:6px!important;min-width:0!important;overflow:hidden!important}
            .compactCardRtn{font-size:16px!important;line-height:1!important;font-weight:800!important;white-space:nowrap!important;color:#111827!important}
            .compactCardSupplier{font-size:13px!important;line-height:1!important;font-weight:650!important;color:#5f6b7c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
            .compactNotified{font-size:12px!important;line-height:1!important;font-weight:900!important;color:#079447!important;flex:0 0 auto!important}
            .compactCardAmount{font-size:16px!important;line-height:1!important;font-weight:850!important;white-space:nowrap!important;background:#f4f6fa!important;border-radius:12px!important;padding:8px 10px!important;color:#111827!important}
            .compactCardProduct{display:grid!important;grid-template-columns:54px minmax(0,1fr)!important;gap:10px!important;align-items:center!important;margin-top:10px!important;padding-top:10px!important;border-top:1px solid #eef1f4!important}
            .compactCardPhoto{width:54px!important;height:54px!important;border-radius:11px!important;object-fit:cover!important;background:#f1f3f6!important;display:grid!important;place-items:center!important;color:#98a2b3!important}
            .compactCardProductName{font-size:13.5px!important;line-height:1.28!important;font-weight:650!important;color:#111827!important;display:-webkit-box!important;-webkit-line-clamp:3!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
            .compactCardBadges{display:flex!important;flex-wrap:wrap!important;gap:6px!important;margin-top:9px!important}
            .compactCardBadges .reasonPill,.compactCardBadges .badge{min-height:26px!important;padding:5px 9px!important;border-radius:999px!important;font-size:10px!important;line-height:1!important;font-weight:700!important}
            .compactCardDate{display:flex!important;align-items:center!important;gap:5px!important;margin-top:9px!important;color:#7a8596!important;font-size:11px!important;line-height:1.1!important}
            .productMiniPhoto{width:42px!important;height:42px!important;object-fit:cover!important;border-radius:9px!important}
            .detailProductImage,.previewProductImage{width:100%!important;height:100%!important;object-fit:cover!important}
          }
          @media(max-width:390px){
            .returnCard.compactCardV2{padding:10px!important;border-radius:16px!important}
            .compactCardRtn{font-size:15px!important}.compactCardSupplier{font-size:12px!important}.compactCardAmount{font-size:15px!important;padding:7px 9px!important}
            .compactCardProduct{grid-template-columns:50px minmax(0,1fr)!important;gap:8px!important;margin-top:8px!important;padding-top:8px!important}
            .compactCardPhoto{width:50px!important;height:50px!important}.compactCardProductName{font-size:12.5px!important}.compactCardBadges .reasonPill,.compactCardBadges .badge{font-size:9.5px!important;padding:4px 7px!important;min-height:24px!important}.compactCardDate{font-size:10px!important}
          }
          </style>
          '''
          styles.write_text(css,encoding='utf-8')
          PY

      - name: Validate patched JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/Index.html').read_text(encoding='utf-8')
          a=s.find('<script>')
          b=s.rfind('</script>')
          if a<0 or b<0 or b<=a: raise SystemExit('script block not found')
          Path('/tmp/index.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/index.js
          cp src/DataActions.gs /tmp/DataActions.js
          node --check /tmp/DataActions.js

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/Styles.html src/DataActions.gs
          git commit -m "Fix compact return card and embedded product photos"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
