name: Mobile top redesign once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved mobile top redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/Index.html')
          text = index.read_text(encoding='utf-8')

          old_header = '''  <header class="pageHeader">\n    <div class="brandBlock">\n      <div class="brandIcon" aria-hidden="true">\n        <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>\n      </div>\n      <div>\n        <h1>Відстеження повернень</h1>\n        <p>Контроль повернень та отримання їх постачальниками</p>\n        <div class="setupLine" id="setupLine">Завантаження…</div>\n      </div>\n    </div>\n    <div class="headerActions">\n      <div class="periodBox" title="Період повернення">\n        <span class="periodIcon">⌗</span>\n        <input type="date" id="periodFrom" onchange="renderAll()" aria-label="Період від">\n        <span class="periodDash">—</span>\n        <input type="date" id="periodTo" onchange="renderAll()" aria-label="Період до">\n      </div>\n      <button class="btn secondary" type="button" onclick="openSettings()">Налаштування</button>\n      <button class="btn secondary iconOnlyDesktop" type="button" onclick="syncNow()" title="Синхронізувати">↻ <span>Синхронізувати</span></button>\n      <button class="btn primary" type="button" onclick="openReturnForm()">+ Додати повернення</button>\n    </div>\n  </header>'''

          new_header = '''  <header class="pageHeader dashboardHero">\n    <div class="brandBlock heroBrand">\n      <div class="brandIcon heroBrandIcon" aria-hidden="true">\n        <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>\n      </div>\n      <div class="heroCopy">\n        <h1><span>Відстеження</span><span>повернень</span></h1>\n        <p>Контроль повернень та отримання їх постачальниками</p>\n        <div class="setupLine heroSetup" id="setupLine">Завантаження…</div>\n      </div>\n    </div>\n    <div class="headerActions heroActions">\n      <div class="periodSyncCard">\n        <div class="periodBox heroPeriod" title="Період повернення" onclick="toggleMobilePeriod(event)">\n          <span class="heroActionIcon calendarIcon" aria-hidden="true">\n            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="8" cy="14" r=".7"/><circle cx="12" cy="14" r=".7"/><circle cx="16" cy="14" r=".7"/></svg>\n          </span>\n          <span class="heroPeriodText"><small>Період</small><strong>Період <span class="periodChevron">⌄</span></strong></span>\n          <span class="periodInputs" id="mobilePeriodPanel" onclick="event.stopPropagation()">\n            <input type="date" id="periodFrom" onchange="renderAll()" aria-label="Період від">\n            <span class="periodDash">—</span>\n            <input type="date" id="periodTo" onchange="renderAll()" aria-label="Період до">\n          </span>\n        </div>\n        <button class="heroSync" type="button" onclick="syncNow()" title="Синхронізувати">\n          <span class="heroSyncIcon" aria-hidden="true">↻</span><span>Синхронізація</span>\n        </button>\n      </div>\n      <button class="btn secondary heroSettings" type="button" onclick="openSettings()"><span class="heroBtnIcon">⚙</span><span>Налаштування</span></button>\n      <button class="btn primary heroAdd" type="button" onclick="openReturnForm()"><span class="heroPlus">＋</span><span>Додати</span></button>\n    </div>\n  </header>'''

          old_stats = '''  <section class="statsGrid" aria-label="Статистика">\n    <article class="statCard"><div class="statIcon green">▣</div><div><div class="statValue" id="statTotal">0</div><div class="statLabel">Усього повернень</div><div class="statHint">за вибраний період</div></div></article>\n    <article class="statCard"><div class="statIcon amber">◷</div><div><div class="statValue" id="statWaiting">0</div><div class="statLabel">Очікують</div><div class="statHint">потребують контролю</div></div></article>\n    <article class="statCard"><div class="statIcon green">✓</div><div><div class="statValue" id="statPicked">0</div><div class="statLabel">Забрано постачальником</div><div class="statHint">фактично отримано</div></div></article>\n    <article class="statCard"><div class="statIcon neutral">₴</div><div><div class="statValue" id="statAmount">0 ₴</div><div class="statLabel">Сума повернень</div><div class="statHint">за вибраний період</div></div></article>\n  </section>'''

          new_stats = '''  <section class="statsGrid heroStats" aria-label="Статистика">\n    <article class="statCard statTotalCard"><div class="statIcon green">▣</div><span class="statChevron">›</span><div class="statBody"><div class="statValue" id="statTotal">0</div><div class="statLabel">Усього повернень</div><div class="statHint">за вибраний період</div></div></article>\n    <article class="statCard statWaitingCard"><div class="statIcon amber">◷</div><span class="statChevron">›</span><div class="statBody"><div class="statValue" id="statWaiting">0</div><div class="statLabel">Очікують</div><div class="statHint">потребують контролю</div></div></article>\n    <article class="statCard statPickedCard"><div class="statIcon green">✓</div><span class="statChevron">›</span><div class="statBody"><div class="statValue" id="statPicked">0</div><div class="statLabel">Забрано постачальником</div><div class="statHint">фактично отримано</div></div></article>\n    <article class="statCard statAmountCard"><div class="statIcon neutral">▤</div><span class="statChevron">›</span><div class="statBody"><div class="statValue" id="statAmount">0 ₴</div><div class="statLabel">Сума повернень</div><div class="statHint">за вибраний період</div></div></article>\n  </section>'''

          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          if old_stats in text:
              text = text.replace(old_stats, new_stats, 1)

          old_setup = "function renderSetup(){const s=model.setup||{},active=[];if(s.salesDrive)active.push('SalesDrive');if(s.novaPoshta)active.push('НП');if(s.ukrposhta)active.push('Укрпошта');if(s.prom)active.push('Prom');document.getElementById('setupLine').textContent=active.length?'Підключено: '+active.join(' · ')+' · автооновлення щогодини':'API ще не налаштовані · ручні повернення доступні';}"
          new_setup = "function renderSetup(){const s=model.setup||{},active=[];if(s.salesDrive)active.push('SalesDrive');if(s.novaPoshta)active.push('НП');if(s.ukrposhta)active.push('Укрпошта');if(s.prom)active.push('Prom');const el=document.getElementById('setupLine');el.innerHTML=active.length?'<span class=\\\"setupLinkIcon\\\">↗</span><span>Підключено: '+active.map(x=>'<strong>'+esc(x)+'</strong>').join(' · ')+' <b>·</b> автооновлення щогодини</span>':'<span class=\\\"setupLinkIcon\\\">↗</span><span>API ще не налаштовані · ручні повернення доступні</span>'; }"
          if old_setup in text:
              text = text.replace(old_setup, new_setup, 1)

          anchor = "function syncNow(){call('apiSync',undefined,data=>{model=data||model;renderAll();toast('Синхронізацію завершено');},'Синхронізація…');}"
          helper = anchor + "\nfunction toggleMobilePeriod(event){if(window.innerWidth>760)return;const box=document.querySelector('.heroPeriod');if(!box)return;box.classList.toggle('periodOpen');if(event)event.stopPropagation();}"
          if 'function toggleMobilePeriod' not in text and anchor in text:
              text = text.replace(anchor, helper, 1)

          index.write_text(text, encoding='utf-8')

          styles = Path('src/Styles.html')
          css = styles.read_text(encoding='utf-8')
          marker = '/* MOBILE_TOP_V2 */'
          if marker not in css:
              css += r'''\n<style>\n/* MOBILE_TOP_V2 */\n.statChevron,.heroActionIcon,.heroPeriodText,.heroSyncIcon,.heroBtnIcon,.heroPlus{display:none}\n@media(max-width:760px){\n  body{background:#f4f7f8}\n  .app{padding:18px 16px 12px}\n  .dashboardHero{display:block;position:relative;margin:0 0 14px;padding:8px 2px 0}\n  .dashboardHero::before,.dashboardHero::after{content:'';position:absolute;z-index:-1;border-radius:44% 56% 62% 38%;background:linear-gradient(145deg,rgba(205,250,220,.7),rgba(232,255,239,.25));filter:blur(.2px);pointer-events:none}\n  .dashboardHero::before{width:180px;height:150px;right:-76px;top:-44px;transform:rotate(18deg)}\n  .dashboardHero::after{width:125px;height:130px;right:-42px;top:65px;opacity:.55;transform:rotate(-18deg)}\n  .heroBrand{display:grid;grid-template-columns:66px minmax(0,1fr);gap:16px;align-items:start;width:100%}\n  .heroBrandIcon{width:66px;height:66px;border-radius:20px;background:linear-gradient(145deg,#e8fff0,#d9f8e5);box-shadow:0 8px 24px rgba(20,130,72,.08);margin-top:3px}\n  .heroBrandIcon svg{width:40px;height:40px;stroke-width:1.9}\n  .heroCopy h1{font-size:35px;line-height:.98;margin:0 0 13px;font-weight:850;letter-spacing:-.045em}\n  .heroCopy h1 span{display:block}\n  .heroCopy p{font-size:18px;line-height:1.16;color:#697386;margin:0;max-width:310px;letter-spacing:-.018em}\n  .heroSetup{grid-column:1/-1;margin:17px 0 0 -1px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.25;color:#6e788a;white-space:nowrap;overflow:hidden}\n  .heroSetup strong{color:#0b9c50;font-weight:750}.heroSetup b{font-weight:500;color:#7f8898}\n  .setupLinkIcon{width:32px;height:32px;border-radius:50%;background:#e4faeb;color:#07994b;display:grid;place-items:center;font-size:17px;font-weight:800;flex:0 0 auto;transform:rotate(-12deg)}\n\n  .heroActions{margin-top:16px;display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;width:100%}\n  .periodSyncCard{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.55fr) 1px minmax(118px,.85fr);align-items:stretch;background:#fff;border:1px solid #edf0f3;border-radius:18px;box-shadow:0 8px 24px rgba(16,24,40,.055);min-height:92px;overflow:visible}\n  .periodSyncCard::before{content:'';grid-column:2;grid-row:1;background:#e8ebef;width:1px;margin:18px 0}\n  .heroPeriod{grid-column:1;grid-row:1;position:relative!important;width:auto!important;height:auto!important;min-width:0!important;max-width:none!important;border:0!important;box-shadow:none!important;background:transparent!important;border-radius:0!important;display:grid!important;grid-template-columns:50px minmax(0,1fr)!important;gap:12px!important;align-items:center!important;padding:16px 18px!important;overflow:visible!important;cursor:pointer}\n  .heroActionIcon{display:grid;width:48px;height:48px;place-items:center;color:#64708a}\n  .heroActionIcon svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n  .heroPeriodText{display:grid;min-width:0}.heroPeriodText small{font-size:14px;color:#7d8798;line-height:1.05}.heroPeriodText strong{font-size:27px;line-height:1.05;margin-top:4px;font-weight:750;letter-spacing:-.035em;color:#101828}.periodChevron{font-size:23px;margin-left:5px}\n  .periodInputs{display:none;position:absolute;left:12px;right:12px;top:86px;z-index:12;background:#fff;border:1px solid #e3e7eb;border-radius:13px;box-shadow:0 14px 35px rgba(16,24,40,.16);padding:10px;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}\n  .heroPeriod.periodOpen .periodInputs{display:grid}.periodInputs input{width:100%!important;min-width:0!important;height:38px!important;border:1px solid #e3e7eb!important;border-radius:9px!important;padding:0 7px!important;font-size:12px!important;background:#fff!important}.periodInputs .periodDash{display:block!important;text-align:center}\n  .heroSync{grid-column:3;grid-row:1;border:0;background:#fff;border-radius:0 18px 18px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#667085;font-size:13px;cursor:pointer;padding:12px 8px}\n  .heroSyncIcon{display:block;color:#07994b;font-size:43px;line-height:.8;font-weight:400}.heroSync:hover{background:#fbfdfb}\n  .heroSettings,.heroAdd{grid-column:auto!important;width:100%!important;min-height:66px!important;border-radius:17px!important;font-size:18px!important;font-weight:700!important;gap:10px!important;padding:12px 14px!important;box-shadow:0 6px 18px rgba(16,24,40,.045)!important}\n  .heroSettings{background:#fff!important;border:1px solid #e9edf1!important;color:#101828!important}.heroAdd{background:linear-gradient(135deg,#0aa250,#078842)!important;border-color:#078842!important;color:#fff!important}\n  .heroBtnIcon,.heroPlus{display:inline-flex;align-items:center;justify-content:center;font-size:27px;line-height:1}.heroPlus{font-size:34px;font-weight:300}\n\n  .heroStats{grid-template-columns:1fr 1fr!important;gap:10px!important;margin:0 0 14px!important}\n  .heroStats .statCard{position:relative;display:block!important;min-height:132px!important;padding:14px 14px 13px!important;border-radius:17px!important;overflow:hidden;background:#fff!important;border:1px solid #edf0f3!important;box-shadow:0 7px 22px rgba(16,24,40,.05)!important}\n  .heroStats .statCard::after{content:'';position:absolute;width:104px;height:80px;right:-33px;bottom:-38px;border-radius:50%;background:#e8fbef;opacity:.9}\n  .heroStats .statWaitingCard::after{background:#fff5db}.heroStats .statAmountCard::after{background:#eef1f5}\n  .heroStats .statIcon{width:38px!important;height:38px!important;border-radius:11px!important;margin:0 0 12px!important;font-size:18px!important;position:relative;z-index:1}\n  .heroStats .statChevron{display:block;position:absolute;right:13px;top:13px;font-size:27px;line-height:1;color:#5d6880;z-index:2;font-weight:300}\n  .heroStats .statBody{position:relative;z-index:1}.heroStats .statValue{font-size:33px!important;line-height:.95!important;margin:0 0 4px!important;font-weight:850!important;letter-spacing:-.045em!important;white-space:nowrap}\n  .heroStats .statLabel{font-size:14px!important;line-height:1.08!important;color:#5f6a80!important;font-weight:500!important;max-width:170px}.heroStats .statHint{display:none!important}\n}\n@media(max-width:390px){\n  .app{padding:14px 12px 10px}.heroBrand{grid-template-columns:58px minmax(0,1fr);gap:13px}.heroBrandIcon{width:58px;height:58px;border-radius:18px}.heroBrandIcon svg{width:35px;height:35px}.heroCopy h1{font-size:31px}.heroCopy p{font-size:16px}.heroSetup{font-size:12.5px;gap:8px}.setupLinkIcon{width:29px;height:29px}.periodSyncCard{min-height:86px;grid-template-columns:minmax(0,1.45fr) 1px minmax(105px,.8fr)}.heroPeriod{grid-template-columns:42px minmax(0,1fr)!important;padding:14px 13px!important;gap:9px!important}.heroActionIcon{width:40px;height:40px}.heroActionIcon svg{width:36px;height:36px}.heroPeriodText small{font-size:12px}.heroPeriodText strong{font-size:23px}.heroSync{font-size:11.5px}.heroSyncIcon{font-size:38px}.heroSettings,.heroAdd{min-height:60px!important;font-size:16px!important}.heroStats .statCard{min-height:120px!important;padding:12px!important}.heroStats .statValue{font-size:29px!important}.heroStats .statLabel{font-size:12.5px!important}.heroStats .statIcon{width:34px!important;height:34px!important;margin-bottom:10px!important}.heroStats .statChevron{right:11px;top:10px;font-size:24px}}\n</style>\n'''
              styles.write_text(css, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/Styles.html
          git commit -m "Match mobile dashboard top to approved design"
          git push
