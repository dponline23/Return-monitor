name: Repair mobile dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mobile-top.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python scripts/repair_mobile_top.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Styles.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix mobile dashboard top [skip ci]"
          git push
