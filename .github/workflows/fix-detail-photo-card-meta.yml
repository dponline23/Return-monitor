name: Targeted detail photo and card meta fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-photo-card-meta.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Patch detail photo and compact card meta only
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/Index.html')
          s = index.read_text(encoding='utf-8')

          # 1) Robust detail-image loader: fetch the Drive file through Apps Script,
          # then inject a real image only after we have image data.
          if 'function hydrateDetailProductImage(imageUrl)' not in s:
              marker = 'function mobileCardHtml(row){'
              pos = s.index(marker)
              helper = r'''function hydrateDetailProductImage(imageUrl){
            const shell=document.getElementById('detailProductImageShell');
            if(!shell||!imageUrl)return;
            const setFallback=function(){
              const direct=directProductImageUrl(imageUrl);
              if(!direct)return;
              const img=document.createElement('img');
              img.className='detailProductImage';
              img.alt='';
              img.onload=function(){shell.classList.remove('loading');};
              img.onerror=function(){shell.innerHTML='<div class="detailImagePlaceholder">▧</div>';};
              img.src=direct;
              shell.replaceChildren(img);
            };
            shell.classList.add('loading');
            google.script.run
              .withSuccessHandler(function(dataUrl){
                if(!shell.isConnected)return;
                if(!dataUrl){setFallback();return;}
                const img=document.createElement('img');
                img.className='detailProductImage';
                img.alt='';
                img.onload=function(){shell.classList.remove('loading');};
                img.onerror=setFallback;
                img.src=dataUrl;
                shell.replaceChildren(img);
              })
              .withFailureHandler(setFallback)
              .apiGetProductImageData(imageUrl);
          }
          '''
              s = s[:pos] + helper + s[pos:]

          # 2) Replace only the mobile-card renderer. RTN stays top-left, amount top-right;
          # supplier + date move together to the lower-right.
          a = s.index('function mobileCardHtml(row){')
          b = s.index('function emptyStateHtml', a)
          mobile = r'''function mobileCardHtml(row){
            const image=row.productImage?productImageTag(row.productImage,'compactCardPhoto'):'<span class="compactCardPhoto compactCardPlaceholder">▧</span>';
            const supplier=esc(row.supplierName||'Постачальник не вказаний');
            const notified=row.supplierNotified?'<span class="compactNotified" title="Постачальника сповіщено">✓</span>':'';
            return `<article class="returnCard compactCardV2" onclick="openDetails('${jsq(row.id)}')">
              <div class="compactCardHead">
                <div class="compactCardIdentity"><strong class="compactCardRtn">${esc(compactReturnNumber(row.returnNumber))}</strong></div>
                <strong class="compactCardAmount">${money(row.amount)}</strong>
              </div>
              ${(row.productName||row.productImage)?`<div class="compactCardProduct">${image}<div class="compactCardProductName">${esc(row.productName||'Товар')}</div></div>`:''}
              <div class="compactCardBadges"><span class="reasonPill">${esc(reasonLabel(row.returnReason,row.returnReasonComment)||'Причина не вказана')}</span>${statusBadge(row.returnStatus)}${pickupBadge(row.supplierPickupStatus)}</div>
              <div class="compactCardMeta"><span class="compactCardSupplierBottom">${supplier}${notified}</span><span class="compactCardDateBottom">${fmtDateTimeShort(row.returnDate||row.arrivedAt||row.returnStartedAt)}</span></div>
            </article>`;
          }
          '''
          s = s[:a] + mobile + s[b:]

          # 3) Detail page: do not render a broken external <img>. Render a shell,
          # then hydrate it explicitly through apiGetProductImageData().
          start = s.index('function renderDetails(){')
          end = s.index('\n}\nfunction togglePickupMenu', start)
          block = s[start:end]
          old = "const productBlock=(row.productName||row.productImage)?`<section class=\"detailSection\"><h3>Товар</h3><div class=\"detailProduct\">${row.productImage?productImageTag(row.productImage,'detailProductImage'):'<div class=\"detailImagePlaceholder\">▧</div>'}<div><strong>${esc(row.productName||'Товар')}</strong></div></div></section>`:'';"
          new = "const productBlock=(row.productName||row.productImage)?`<section class=\"detailSection\"><h3>Товар</h3><div class=\"detailProduct\">${row.productImage?'<div class=\"detailImageShell\" id=\"detailProductImageShell\"><div class=\"detailImagePlaceholder\">▧</div></div>':'<div class=\"detailImagePlaceholder\">▧</div>'}<div><strong>${esc(row.productName||'Товар')}</strong></div></div></section>`:'';"
          if old not in block:
              raise SystemExit('renderDetails product block pattern not found')
          block = block.replace(old, new, 1)
          if 'hydrateDetailProductImage(row.productImage);' not in block:
              block += "\n  if(row.productImage)hydrateDetailProductImage(row.productImage);"
          s = s[:start] + block + s[end:]

          index.write_text(s, encoding='utf-8')

          styles = Path('src/Styles.html')
          css = styles.read_text(encoding='utf-8')
          marker = '/* CARD_META_AND_DETAIL_PHOTO_V1 */'
          if marker not in css:
              css += r'''

          <style>
          /* CARD_META_AND_DETAIL_PHOTO_V1 */
          .detailImageShell{
            width:80px;
            height:80px;
            border-radius:14px;
            overflow:hidden;
            background:#f1f3f6;
            display:grid;
            place-items:center;
            flex:0 0 80px;
          }
          .detailImageShell .detailProductImage{
            width:100%!important;
            height:100%!important;
            object-fit:cover!important;
            display:block!important;
          }
          .detailImageShell.loading{opacity:.82}

          @media(max-width:760px){
            .compactCardMeta{
              display:flex!important;
              justify-content:flex-end!important;
              align-items:center!important;
              gap:8px!important;
              flex-wrap:wrap!important;
              margin-top:9px!important;
              padding-top:8px!important;
              border-top:1px solid #eef1f4!important;
              text-align:right!important;
            }
            .compactCardSupplierBottom{
              display:inline-flex!important;
              align-items:center!important;
              gap:4px!important;
              max-width:55%!important;
              overflow:hidden!important;
              text-overflow:ellipsis!important;
              white-space:nowrap!important;
              color:#5f6b7c!important;
              font-size:11px!important;
              line-height:1.1!important;
              font-weight:700!important;
            }
            .compactCardDateBottom{
              color:#7a8596!important;
              font-size:11px!important;
              line-height:1.1!important;
              white-space:nowrap!important;
            }
            .compactCardMeta .compactNotified{
              font-size:10px!important;
              flex:0 0 auto!important;
            }
            .compactCardHead .compactCardIdentity{overflow:visible!important}
            .detailImageShell{
              width:72px;
              height:72px;
              flex-basis:72px;
              border-radius:12px;
            }
          }
          @media(max-width:390px){
            .compactCardSupplierBottom,.compactCardDateBottom{font-size:10px!important}
            .detailImageShell{width:68px;height:68px;flex-basis:68px}
          }
          </style>
          '''
          styles.write_text(css, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/Index.html').read_text(encoding='utf-8')
          a=s.find('<script>')
          b=s.rfind('</script>')
          if a<0 or b<0 or b<=a: raise SystemExit('script block not found')
          Path('/tmp/index.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/index.js
          cp src/DataActions.gs /tmp/DataActions.js
          node --check /tmp/DataActions.js

      - name: Commit targeted source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/Styles.html
          git commit -m "Fix detail product photo and move card metadata"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
