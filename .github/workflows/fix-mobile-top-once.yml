name: Fix mobile top once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mobile-top-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair generated mobile styles
        run: |
          python3 <<'PY'
          from pathlib import Path

          styles = Path('src/Styles.html')
          css = styles.read_text(encoding='utf-8')
          marker = r'\n<style>\n/* MOBILE_TOP_V2 */'
          pos = css.find(marker)
          if pos < 0:
              raise SystemExit('Broken MOBILE_TOP_V2 block not found')
          css = css[:pos] + css[pos:].replace(r'\n', '\n')
          styles.write_text(css, encoding='utf-8')

          index = Path('src/Index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace(
              '<h1><span>Відстеження</span><span>повернень</span></h1>',
              '<h1><span>Відстеження</span> <span>повернень</span></h1>'
          )
          old = '''        <p>Контроль повернень та отримання їх постачальниками</p>
        <div class="setupLine heroSetup" id="setupLine">Завантаження…</div>
      </div>
    </div>'''
          new = '''        <p>Контроль повернень та отримання їх постачальниками</p>
      </div>
      <div class="setupLine heroSetup" id="setupLine">Завантаження…</div>
    </div>'''
          html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/Styles.html
          git commit -m "Repair mobile dashboard CSS" || exit 0
          git push
