name: Fix detail image with shared renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-image-use-shared-renderer.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the exact working image renderer in details
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/Index.html')
          s=p.read_text(encoding='utf-8')
          old="""  const productBlock=(row.productName||row.productImage)?`<section class=\"detailSection\"><h3>Товар</h3><div class=\"detailProduct\">${row.productImage?'<div class=\"detailImageShell\" id=\"detailProductImageShell\"><div class=\"detailImagePlaceholder\">▧</div></div>':'<div class=\"detailImagePlaceholder\">▧</div>'}<div><strong>${esc(row.productName||'Товар')}</strong></div></div></section>`:'';"""
          new="""  const detailImage=row.productImage?productImageTag(row.productImage,'detailProductImage'):'<div class=\"detailImagePlaceholder\">▧</div>';
  const productBlock=(row.productName||row.productImage)?`<section class=\"detailSection\"><h3>Товар</h3><div class=\"detailProduct\">${detailImage}<div><strong>${esc(row.productName||'Товар')}</strong></div></div></section>`:'';"""
          if old not in s:
            raise SystemExit('productBlock target not found')
          s=s.replace(old,new,1)
          old2="""  if(row.productImage)hydrateDetailProductImage(row.productImage);"""
          if old2 not in s:
            raise SystemExit('hydrate call not found')
          s=s.replace(old2,'',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/Index.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          if a<0 or b<=a: raise SystemExit('script block not found')
          Path('/tmp/index.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/index.js

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html
          git commit -m "Use shared product image renderer in return details"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Missing CLASPRC_JSON" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm run clasp:config

      - name: Push Apps Script and update web app
        env:
          RETURN_MONITOR_DEPLOYMENT_ID: ${{ vars.RETURN_MONITOR_DEPLOYMENT_ID }}
        run: node scripts/deploy.cjs

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
