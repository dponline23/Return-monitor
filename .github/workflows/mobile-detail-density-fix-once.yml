name: Mobile detail density fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-detail-density-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply approved mobile mockup sizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('src/Styles.html')
          s = p.read_text(encoding='utf-8')
          block = base64.b64decode('').decode('utf-8')
          p.write_text(s.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/mobile-detail-density-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Styles.html .github/workflows/mobile-detail-density-fix-once.yml
          git commit -m "Match mobile return details approved mockup density"
          git push
