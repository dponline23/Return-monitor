name: Fix mobile dashboard final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-dashboard-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile dashboard fix
        run: python scripts/fix_mobile_dashboard_final.py
      - name: Commit fixed styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Styles.html
          if git diff --cached --quiet; then
            echo "No style changes"
            exit 0
          fi
          git commit -m "Fix mobile dashboard layout [skip ci]"
          git push
